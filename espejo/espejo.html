<div class="espejo-wrapper">
    <div id="view_dashboard" class="dashboard-stats">
        <div class="stat-card locked">
            <div class="icon">🔒</div>
            <div class="info">
                <small>Invertido</small>
                <span id="total_invested">$0.00</span>
            </div>
        </div>
        <div class="stat-card profit">
            <div class="icon">📈</div>
            <div class="info">
                <small>Ganancia</small>
                <span id="net_profit">$0.00</span>
            </div>
        </div>
        <div class="stat-card wallet">
            <div class="icon">💰</div>
            <div class="info">
                <small>Bank</small>
                <span id="user_balance">$0.00</span>
            </div>
        </div>
    </div>

    <div id="view_menu" class="menu-container animate-fade">
        <button class="big-btn btn-add" onclick="window.cambiarVista('form')">
            <div class="btn-icon">➕</div>
            <h3>Agregar</h3>
        </button>

        <button class="big-btn btn-hist" onclick="window.cambiarVista('history')">
            <div class="btn-icon">📜</div>
            <h3>Historial</h3>
        </button>
    </div>

    <div id="view_form" class="content-view hidden">
        <div class="card form-card">
            <div class="card-header">
                <h3>🏆 Nuevo Pick</h3>
                <button class="btn-close-modal" onclick="window.cambiarVista('menu')">✖</button>
            </div>
            
            <form id="betForm" onsubmit="event.preventDefault(); window.registrarApuesta();">
                
                <div class="input-group">
    <label>Competición</label>
    
    <div class="custom-select-wrapper" id="leagueSelectWrapper">
    <select id="sel_liga" class="hidden-native-select" required>
        <option value="">Selecciona Liga...</option>
        <option value="Champions League">Champions League</option>
        <option value="Europa League">Europa League</option>
        <option value="Conference League">Conference League</option>
        <option value="Premier League">Premier League</option>
        <option value="La Liga">La Liga</option>
        <option value="Bundesliga">Bundesliga</option>
        <option value="Serie A">Serie A</option>
    </select>

    <div class="custom-select-trigger">
        <div class="selected-content" id="triggerContent">
            <span style="color: #94a3b8; font-weight: normal;">Selecciona Liga...</span>
        </div>
        <span class="arrow">▼</span>
    </div>

    <div class="custom-options">
        <div class="custom-option" data-value="Champions League">
            <img src="https://cdn.mos.cms.futurecdn.net/c6nfDmk7nEFkdMpAQYzEK4-1000-80.jpg" alt="" class="banner-img">
            <span class="banner-text">Champions League</span>
        </div>

        <div class="custom-option" data-value="Europa League">
            <img src="https://img.uefa.com/imgml/uefacom/uel/social/og-default.jpg" alt="" class="banner-img">
            <span class="banner-text">Europa League</span>
        </div>

        <div class="custom-option" data-value="Conference League">
            <img src="https://m.media-amazon.com/images/S/pv-target-images/9dad5e5640a6fa4801ebca7a13bb419fe8f88542487f6f5563f84083d6e07f46.jpg" alt="" class="banner-img">
            <span class="banner-text">Conference League</span>
        </div>

        <div class="custom-option" data-value="Premier League">
            <img src="https://www.monotype.com/sites/default/files/2019-10/premierleague-hero-new.png" alt="" class="banner-img">
            <span class="banner-text">Premier League</span>
        </div>

        <div class="custom-option" data-value="La Liga">
            <img src="https://crystalpng.com/wp-content/uploads/2023/06/La-liga-new-logo-red.png" alt="" class="banner-img">
            <span class="banner-text">La Liga</span>
        </div>

        <div class="custom-option" data-value="Bundesliga">
            <img src="https://logowik.com/content/uploads/blog/t_bundesliga-football-clubs-and-logos3600.logowik.com.webp" alt="" class="banner-img">
            <span class="banner-text">Bundesliga</span>
        </div>

        <div class="custom-option" data-value="Serie A">
            <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/a/aa/Serie_A.svg/1920px-Serie_A.svg.png" alt="" class="banner-img">
            <span class="banner-text">Serie A</span>
        </div>
    </div>
</div>

                <label style="display:block; font-size:0.7rem; color:#94a3b8; margin-bottom:4px;">Encuentro</label>
                <div class="match-versus-container">
                    <div class="team-box">
                        <img id="img_local" src="" class="team-logo" alt="Local">
                        <select id="sel_local" class="custom-select" onchange="window.actualizarLogoEquipo('local')" required>
                            <option value="">Local</option>
                        </select>
                    </div>
                    
                    <span class="vs-divider">VS</span>

                    <div class="team-box">
                        <img id="img_visit" src="" class="team-logo" alt="Visita">
                        <select id="sel_visitante" class="custom-select" onchange="window.actualizarLogoEquipo('visitante')" required>
                            <option value="">Visita</option>
                        </select>
                    </div>
                </div>

                <div class="input-group">
                    <label>Selección / Mercado</label>
                    <input type="text" id="bet_market" placeholder="Ej. Gana Local, Más de 2.5 goles..." required>
                </div>

                <div class="row-group">
                    <div class="input-group">
                        <label>Monto ($)</label>
                        <input type="number" id="bet_stake" step="0.01" placeholder="100" required>
                    </div>
                    <div class="input-group">
                        <label>Momio (Americano)</label>
                        <input type="number" id="bet_odds" placeholder="-110" required>
                    </div>
                </div>

                <div class="input-group">
                    <label>Estado</label>
                    <select id="bet_status" class="custom-select">
                        <option value="pending">⏳ Pendiente</option>
                        <option value="won">✅ Ganada</option>
                        <option value="lost">❌ Perdida</option>
                        <option value="void">🔄 Nula</option>
                    </select>
                </div>

                <button type="submit" class="btn-registrar">Guardar Pick</button>
            </form>
        </div>
    </div>

    <div id="view_history" class="content-view hidden">
        <div class="card history-card">
            <div class="card-header">
                <h3>📜 Historial</h3>
                <div style="display:flex; gap:10px;">
                    <button class="btn-sm" onclick="window.limpiarHistorial()">Borrar</button>
                    <button class="btn-back" onclick="window.cambiarVista('menu')">⬅</button>
                </div>
            </div>
            
            <div class="table-container">
                <table class="history-table">
                    <thead>
                        <tr>
                            <th>Evento</th>
                            <th>Est</th>
                            <th>$</th>
                            <th>Gan</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="history_list">
                    </tbody>
                </table>
                <div id="empty_msg" class="empty-state">Sin datos.</div>
            </div>
        </div>
    </div>
    
    <script>
        (function() {
            console.log("⚡ Módulo Espejo cargado directamente.");

            // 1. Verificar si las librerías base están listas
            if (typeof window.datosDeportivos === 'undefined') {
                console.warn("Cargando datos.js manualmente...");
                let s1 = document.createElement('script'); s1.src = 'espejo/datos.js?v=' + Date.now(); document.body.appendChild(s1);
            }
            if (typeof window.cambiarVista === 'undefined') {
                 console.warn("Cargando ui.js manualmente...");
                let s2 = document.createElement('script'); s2.src = 'espejo/ui.js?v=' + Date.now(); document.body.appendChild(s2);
            }
            
            // 2. Esperar un poco y arrancar
            setTimeout(() => {
                if (window.initEspejo) {
                    window.initEspejo();
                } else {
                    if (window.cambiarVista) window.cambiarVista('menu');
                    if (window.cargarLigas) window.cargarLigas();
                    if (window.actualizarDashboard) window.actualizarDashboard();
                }
            }, 300); 
        })();
    </script>
</div>
