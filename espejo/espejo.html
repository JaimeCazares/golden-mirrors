<div class="espejo-wrapper">
    <div class="dashboard-stats">
        <div class="stat-card locked">
            <div class="icon">🔒</div>
            <div class="info">
                <small>Invertido</small>
                <span id="total_invested">$0.00</span>
            </div>
        </div>
        <div class="stat-card profit">
            <div class="icon">📈</div>
            <div class="info">
                <small>Ganancia</small>
                <span id="net_profit">$0.00</span>
            </div>
        </div>
        <div class="stat-card wallet">
            <div class="icon">💰</div>
            <div class="info">
                <small>Bank</small>
                <span id="user_balance">$0.00</span>
            </div>
        </div>
    </div>

    <div id="view_menu" class="menu-container animate-fade">
        <button class="big-btn btn-add" onclick="window.cambiarVista('form')">
            <div class="btn-icon">➕</div>
            <h3>Agregar</h3>
        </button>

        <button class="big-btn btn-hist" onclick="window.cambiarVista('history')">
            <div class="btn-icon">📜</div>
            <h3>Historial</h3>
        </button>
    </div>

    <div id="view_form" class="content-view hidden">
        <div class="card form-card">
            <div class="card-header">
                <h3>🏆 Nuevo Pick</h3>
                <button class="btn-back" onclick="window.cambiarVista('menu')">⬅</button>
            </div>
            
            <form id="betForm" onsubmit="event.preventDefault(); window.registrarApuesta();">
                
                <div class="input-group">
                    <label>Competición</label>
                    <div class="league-selector">
                        <img id="img_liga" src="" class="league-logo" alt="Liga">
                        <select id="sel_liga" class="custom-select" onchange="window.actualizarEquipos()" required>
                            <option value="">Selecciona Liga...</option>
                            </select>
                    </div>
                </div>

                <label style="display:block; font-size:0.7rem; color:#94a3b8; margin-bottom:4px;">Encuentro</label>
                <div class="match-versus-container">
                    <div class="team-box">
                        <img id="img_local" src="" class="team-logo" alt="Local">
                        <select id="sel_local" class="custom-select" onchange="window.actualizarLogoEquipo('local')" required>
                            <option value="">Local</option>
                        </select>
                    </div>
                    
                    <span class="vs-divider">VS</span>

                    <div class="team-box">
                        <img id="img_visit" src="" class="team-logo" alt="Visita">
                        <select id="sel_visitante" class="custom-select" onchange="window.actualizarLogoEquipo('visitante')" required>
                            <option value="">Visita</option>
                        </select>
                    </div>
                </div>

                <div class="input-group">
                    <label>Selección / Mercado</label>
                    <input type="text" id="bet_market" placeholder="Ej. Gana Local, Más de 2.5 goles..." required>
                </div>

                <div class="row-group">
                    <div class="input-group">
                        <label>Monto ($)</label>
                        <input type="number" id="bet_stake" step="0.01" placeholder="100" required>
                    </div>
                    <div class="input-group">
                        <label>Momio (Americano)</label>
                        <input type="number" id="bet_odds" placeholder="-110" required>
                    </div>
                </div>

                <div class="input-group">
                    <label>Estado</label>
                    <select id="bet_status" class="custom-select">
                        <option value="pending">⏳ Pendiente</option>
                        <option value="won">✅ Ganada</option>
                        <option value="lost">❌ Perdida</option>
                        <option value="void">🔄 Nula</option>
                    </select>
                </div>

                <button type="submit" class="btn-registrar">Guardar Pick</button>
            </form>
        </div>
    </div>

    <div id="view_history" class="content-view hidden">
        <div class="card history-card">
            <div class="card-header">
                <h3>📜 Historial</h3>
                <div style="display:flex; gap:10px;">
                    <button class="btn-sm" onclick="window.limpiarHistorial()">Borrar</button>
                    <button class="btn-back" onclick="window.cambiarVista('menu')">⬅</button>
                </div>
            </div>
            
            <div class="table-container">
                <table class="history-table">
                    <thead>
                        <tr>
                            <th>Evento</th>
                            <th>Est</th>
                            <th>$</th>
                            <th>Gan</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="history_list">
                    </tbody>
                </table>
                <div id="empty_msg" class="empty-state">Sin datos.</div>
            </div>
        </div>
    </div>
</div>
