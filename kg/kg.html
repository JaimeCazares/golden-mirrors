<div class="pesos-container">
    <ul id="listaPesos">
        <li data-peso="75">75 kg</li>
        <li data-peso="80">80 kg</li>
        <li data-peso="85">85 kg</li>
        <li data-peso="90">90 kg</li>
        <li data-peso="95">95 kg</li>
        <li data-peso="100">100 kg</li>
        <li data-peso="105">105 kg</li>
        <li data-peso="110">110 kg</li>
    </ul>

    <div class="kg-controles-inline">
        <button id="editarBtnKg" class="btn-mini">Editar ✏️</button>
        <div id="pesoSeleccionado">--.-- kg</div>
        <button id="verHistorialKg" class="btn-mini">Historial 📊</button>
    </div>

    <div id="imc-info">
        <div id="imc-lectura">
            <span id="val-imc">--.-</span>
            <small id="lbl-imc">IMC</small>
        </div>
        <div class="imc-visual-group">
            <div class="imc-barra-container">
                <div class="imc-barra-fondo">
                    <div class="tramo bajo"></div>
                    <div class="tramo normal"></div>
                    <div class="tramo sobrepeso"></div>
                    <div class="tramo obesidad"></div>
                    <div class="tramo extrema"></div>
                </div>
                <div id="imc-indicador">▼</div>
            </div>
            <div class="fases-labels">
                <span>Bajo</span>
                <span>Normal</span>
                <span>Sobrepeso</span>
                <span>Obesidad</span>
                <span>Extrema</span>
            </div>
            <div class="fases-numbers">
                <span>18.5</span>
                <span>25</span>
                <span>30</span>
                <span>35</span>
            </div>
        </div>
    </div>
</div>

<div id="modalKg" class="modal" style="display:none;">
    <div class="modal-content">
        <span id="cerrarKgModal" class="close">&times;</span>
        <h2 class="grid-semanas-header">📊 Historial Anual</h2>
        <div id="historialKgLista" class="grid-semanas"></div>
        <hr style="border: 0; border-top: 1px solid #30475e; margin: 15px 0;">
        <div class="fila-linea-unica">
            <button id="btnVerTodo" class="btn-accion-lateral">🖼️ Progreso</button>
            <h3 class="titulo-central-registro" id="tituloRegistroForm">➕ Nuevo registro</h3>
            <button id="btnAntesDespues" class="btn-accion-lateral">⚖️ Comparar</button>
        </div>
        <div class="fila-angulos-btns">
            <button type="button" id="btnVerFrenteHist" class="btn-accion-lateral">📷 Frente</button>
            <button type="button" id="btnVerLadoHist" class="btn-accion-lateral">📷 Lado</button>
            <button type="button" id="btnVerAtrasHist" class="btn-accion-lateral">📷 Atrás</button>
        </div>
        <div id="avisoEdicionSemana" style="display:none; text-align:center; margin:-8px 0 10px; font-size:0.8rem; color:#00e0ff;">
            Dejar una foto vacía conserva la que ya estaba guardada.
            <a href="#" id="cancelarEdicionSemana" style="color:#f87171; margin-left:6px;">Cancelar edición ✖</a>
        </div>
        <form id="formHistorialKg">
            <div class="fila-peso-semana">
                <label class="campo-semana">
                    <span class="campo-semana-label">Semana</span>
                    <input type="number" min="0" id="nuevaSemana" name="semana" readonly required>
                </label>
                <input type="number" step="0.01" id="nuevoPeso" name="peso" placeholder="Peso (kg)" required>
            </div>
            <div class="upload-grid-modern">
                <div class="upload-item-cool">
                    <label for="fotoFrente">
                        <span class="icon">📷</span> 
                        <span class="label-text">Frente</span>
                        <span id="fileNameFrente" class="file-name">Sin archivo</span>
                    </label>
                    <input type="file" name="foto_frente" id="fotoFrente" accept="image/*">
                </div>
                <div class="upload-item-cool">
                    <label for="fotoLado">
                        <span class="icon">📷</span> 
                        <span class="label-text">Lado</span>
                        <span id="fileNameLado" class="file-name">Sin archivo</span>
                    </label>
                    <input type="file" name="foto_lado" id="fotoLado" accept="image/*">
                </div>
                <div class="upload-item-cool">
                    <label for="fotoAtras">
                        <span class="icon">📷</span> 
                        <span class="label-text">Atrás</span>
                        <span id="fileNameAtras" class="file-name">Sin archivo</span>
                    </label>
                    <input type="file" name="foto_atras" id="fotoAtras" accept="image/*">
                </div>
            </div>
            <button type="button" id="guardarPesoHistorial">Guardar Registro</button>
        </form>
    </div>
</div>

<div id="modalVerFotos" class="modal-fotos-visor" style="display:none;">
    <div class="modal-content-visor">
        <span id="cerrarVerFotos" class="close-visor">&times;</span>
        <h2 id="tituloVerFotos" style="text-align:center; color:#00e0ff; margin-bottom:15px;">Semana X</h2>
        <div id="contenedorGaleriaDinamica" class="galeria-modal-flex">
             </div>
        <div id="infoPesoModal" style="text-align:center; margin-top:15px; font-weight:bold; color:#fff;"></div>
    </div>
</div>

<div id="modalAnguloFotos" class="modal-angulo-fullscreen" style="display:none;">
    <span id="cerrarAnguloFotos" class="close-visor">&times;</span>
    <h2 id="tituloAnguloFotos" class="angulo-titulo">📷 Frente</h2>
    <div id="contenedorAnguloFotos" class="angulo-fila-completa"></div>
</div>
