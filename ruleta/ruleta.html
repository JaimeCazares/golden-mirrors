<div class="rl">

  <header class="rl-head">
    <h1 class="rl-title"><em>¿qué hacemos?</em></h1>
    <p class="rl-sub">giren · dejen que el destino decida 💕</p>
  </header>

  <div class="rl-body">

    <!-- ── izquierda: ruedas ── -->
    <div class="rl-left">

      <div class="rl-card">
        <div class="rl-tag">01 · tipo de actividad</div>
        <div class="rl-wcanvas-wrap">
          <div class="rl-pin"></div>
          <canvas id="rl-cat-c" width="230" height="230"></canvas>
        </div>
        <button class="rl-btn rl-btn--cat" id="rl-cat-btn" onclick="rlSpinCat()">girar ✦</button>
        <div id="rl-cat-result" class="rl-cat-result" style="display:none"></div>
      </div>

      <div class="rl-card">
        <div class="rl-tag">02 · actividad específica</div>
        <div class="rl-wcanvas-wrap" style="position:relative">
          <div class="rl-pin"></div>
          <canvas id="rl-act-c" width="230" height="230"></canvas>
          <div class="rl-canvas-lock" id="rl-canvas-lock">primero elige<br>el tipo 👆</div>
        </div>
        <button class="rl-btn rl-btn--act" id="rl-act-btn" onclick="rlSpinAct()" disabled>girar ✦</button>
        <div id="rl-act-result" class="rl-act-result" style="display:none"></div>
      </div>

    </div>

    <!-- ── derecha: paneles ── -->
    <div class="rl-right">
      <div class="rl-panels-label">todas las actividades</div>
      <div class="rl-panels" id="rl-panels"></div>
    </div>

  </div>
</div>
