<div class="mm-root" id="mm-root">

  <!-- ESCENA ANIMADA DE FONDO — mismos paisajes en video de Nutrición -->
  <div class="mm-scene" id="mm-scene">

    <div class="mm-layer mm-layer-otono" data-theme-layer="otono">
      <video class="mm-video-bg" loop muted playsinline preload="none" data-src="nutricion/videos/otono.mp4"></video>
      <div class="mm-photo-overlay mm-overlay-otono"></div>
    </div>

    <div class="mm-layer mm-layer-playa" data-theme-layer="playa">
      <video class="mm-video-bg" loop muted playsinline preload="none" data-src="nutricion/videos/playa.mp4"></video>
      <div class="mm-photo-overlay mm-overlay-playa"></div>
    </div>

    <div class="mm-layer mm-layer-aurora" data-theme-layer="aurora">
      <video class="mm-video-bg" loop muted playsinline preload="none" data-src="nutricion/videos/aurora.mp4"></video>
      <div class="mm-photo-overlay mm-overlay-aurora"></div>
    </div>

    <div class="mm-layer mm-layer-nieve" data-theme-layer="nieve">
      <video class="mm-video-bg" loop muted playsinline preload="none" data-src="nutricion/videos/nieve.mp4"></video>
      <div class="mm-photo-overlay mm-overlay-nieve"></div>
    </div>

    <div class="mm-layer mm-layer-lluvia" data-theme-layer="lluvia">
      <video class="mm-video-bg" loop muted playsinline preload="none" data-src="nutricion/videos/lluvia2.mp4"></video>
      <div class="mm-photo-overlay mm-overlay-lluvia"></div>
    </div>

    <div class="mm-layer mm-layer-atardecer" data-theme-layer="atardecer">
      <video class="mm-video-bg" loop muted playsinline preload="none" data-src="nutricion/videos/atardecer.mp4"></video>
      <div class="mm-photo-overlay mm-overlay-atardecer"></div>
    </div>

    <div class="mm-vignette"></div>
  </div>

<div class="mm-wrap" id="mm-wrap">

  <div class="mm-header">
    <div class="mm-title-group">
      <h2 class="mm-title">⚽ Momios</h2>
      <p class="mm-sub">Champions League — registro 6:00 AM / 7:00 PM</p>
    </div>

    <div class="mm-theme-wrap">
      <button type="button" class="mm-theme-btn" id="mm-theme-btn" onclick="mmToggleThemeMenu()" title="Cambiar diseño">
        <span class="mtb-glow"></span>
        <span class="mtb-emoji" id="mm-theme-btn-emoji">🌧️</span>
      </button>
      <div class="mm-theme-menu" id="mm-theme-menu"></div>
    </div>
  </div>

  <div class="mm-stats" id="mm-stats"></div>

  <!-- EXTRACCIÓN DESDE IMAGEN -->
  <div class="mm-form-card mm-extraer-card">
    <input type="file" id="mm-input-imagen" accept="image/png,image/jpeg,image/webp,image/gif" style="display:none" onchange="mmImagenSeleccionada(this)">
    <button type="button" class="mm-btn-extraer" id="mm-btn-extraer" onclick="document.getElementById('mm-input-imagen').click()">
      📷 Cargar imagen de momios
    </button>
    <p class="mm-extraer-msg" id="mm-extraer-msg"></p>
    <div class="mm-extraidos" id="mm-extraidos"></div>
  </div>

  <!-- FORMULARIO DE CAPTURA -->
  <div class="mm-form-card" id="mm-form-card">

    <div class="mm-form-row">
      <div class="mm-field">
        <label>Fecha</label>
        <input type="date" id="mm-input-fecha">
      </div>
      <div class="mm-field">
        <label>Turno</label>
        <select id="mm-input-turno">
          <option value="manana">🌅 Mañana (6:00 AM)</option>
          <option value="tarde">🌆 Tarde (7:00 PM)</option>
        </select>
      </div>
    </div>

    <div class="mm-form-row">
      <div class="mm-field">
        <label>Equipo local</label>
        <input type="text" id="mm-input-local" placeholder="Ej. Real Madrid" autocomplete="off">
      </div>
      <div class="mm-field">
        <label>Equipo visitante</label>
        <input type="text" id="mm-input-visitante" placeholder="Ej. Bayern Múnich" autocomplete="off">
      </div>
    </div>

    <div class="mm-form-row mm-form-row-3">
      <div class="mm-field">
        <label>Momio 1 (Local)</label>
        <input type="number" step="1" id="mm-input-m1" placeholder="-400">
      </div>
      <div class="mm-field">
        <label>Momio X (Empate)</label>
        <input type="number" step="1" id="mm-input-mx" placeholder="+275">
      </div>
      <div class="mm-field">
        <label>Momio 2 (Visitante)</label>
        <input type="number" step="1" id="mm-input-m2" placeholder="+165">
      </div>
    </div>

    <div class="mm-field">
      <label>Notas (opcional)</label>
      <input type="text" id="mm-input-notas" placeholder="Casa de apuestas, observaciones..." autocomplete="off">
    </div>

    <button type="button" class="mm-btn-guardar" id="mm-btn-guardar" onclick="mmGuardarRegistro()">
      💾 Guardar momio
    </button>
    <p class="mm-form-msg" id="mm-form-msg"></p>
  </div>

  <!-- LISTA DE REGISTROS -->
  <div class="mm-lista-section">
    <div class="mm-lista-head">
      <span>📋 Registros</span>
      <div class="mm-lista-filtros">
        <button type="button" class="mm-filtro-btn activo" data-dias="7" onclick="mmFiltrarDias(7, this)">7 días</button>
        <button type="button" class="mm-filtro-btn" data-dias="30" onclick="mmFiltrarDias(30, this)">30 días</button>
        <button type="button" class="mm-filtro-btn" data-dias="0" onclick="mmFiltrarDias(0, this)">Todo</button>
      </div>
    </div>
    <div class="mm-lista" id="mm-lista">
      <p class="mm-lista-vacio">Cargando registros...</p>
    </div>
  </div>

</div>
</div>
