<div class="nutri-root" id="nutri-root">

  <!-- ESCENA ANIMADA DE FONDO — Fotografías reales -->
  <div class="nutri-scene" id="nutri-scene">

    <!-- OTOÑO -->
    <div class="nutri-layer nutri-layer-otono" data-theme-layer="otono">
      <video class="nutri-video-bg" autoplay loop muted playsinline preload="auto">
        <source src="nutricion/videos/otono.mp4" type="video/mp4">
      </video>
      <div class="nutri-photo-overlay nutri-overlay-otono"></div>
    </div>

    <!-- PLAYA -->
    <div class="nutri-layer nutri-layer-playa" data-theme-layer="playa">
      <video class="nutri-video-bg" autoplay loop muted playsinline preload="auto">
        <source src="nutricion/videos/playa.mp4" type="video/mp4">
      </video>
      <div class="nutri-photo-overlay nutri-overlay-playa"></div>
    </div>

    <!-- AURORA BOREAL -->
    <div class="nutri-layer nutri-layer-aurora" data-theme-layer="aurora">
      <video class="nutri-video-bg" autoplay loop muted playsinline preload="auto">
        <source src="nutricion/videos/aurora.mp4" type="video/mp4">
      </video>
      <div class="nutri-photo-overlay nutri-overlay-aurora"></div>
    </div>

    <!-- NIEVE -->
    <div class="nutri-layer nutri-layer-nieve" data-theme-layer="nieve">
      <video class="nutri-video-bg" autoplay loop muted playsinline preload="auto">
        <source src="nutricion/videos/nieve.mp4" type="video/mp4">
      </video>
      <div class="nutri-photo-overlay nutri-overlay-nieve"></div>
    </div>

    <!-- LLUVIA -->
    <div class="nutri-layer nutri-layer-lluvia" data-theme-layer="lluvia">
      <video class="nutri-video-bg" autoplay loop muted playsinline preload="auto">
        <source src="nutricion/videos/lluvia2.mp4" type="video/mp4">
      </video>
      <div class="nutri-photo-overlay nutri-overlay-lluvia"></div>
    </div>

    <!-- ATARDECER -->
    <div class="nutri-layer nutri-layer-atardecer" data-theme-layer="atardecer">
      <video class="nutri-video-bg" autoplay loop muted playsinline preload="auto">
        <source src="nutricion/videos/atardecer.mp4" type="video/mp4">
      </video>
      <div class="nutri-photo-overlay nutri-overlay-atardecer"></div>
    </div>

    <div class="nutri-vignette"></div>
  </div>

  <div class="nutricion-container">

    <!-- HEADER -->
    <div class="nutri-header">
      <div class="nutri-header-left">
        <div class="nutri-titulo">Nutrición</div>
        <div class="nutri-fecha-label" id="n-fecha-label"></div>
      </div>
      <div class="nutri-theme-wrap">
        <button type="button" class="nutri-theme-btn" id="n-theme-btn" onclick="nutriToggleThemeMenu()" title="Cambiar paisaje">
          <span class="ntb-glow"></span>
          <span class="ntb-emoji" id="n-theme-btn-emoji">🌧️</span>
        </button>
        <div class="nutri-theme-menu" id="n-theme-menu"></div>
      </div>
    </div>

    <!-- BMR + MI BAND ROW -->
    <div class="nutri-top-cards">

      <!-- BMR -->
      <div class="nutri-top-card bmr-card">
        <div class="ntc-label">Solo por existir</div>
        <div class="ntc-valor"><span id="n-bmr-val">2,500</span> <small>kcal</small></div>
        <button type="button" class="ntc-edit-btn" onclick="nutriEditarBMR()">✏️</button>
      </div>

      <!-- MI BAND -->
      <div class="nutri-top-card miband-card">
        <div class="ntc-label">Actividad Mi Band</div>
        <div class="ntc-miband-input" id="n-miband-display">
          <span id="n-miband-val">—</span> <small>kcal</small>
          <button type="button" class="ntc-edit-btn" onclick="nutriEditarMiBand()">✏️</button>
        </div>
      </div>

    </div>

    <!-- PLAN NUTRICIONAL -->
    <div id="plan-root">
      <div style="text-align:center;padding:40px 20px;color:#7a82a0;font-size:0.85rem">Cargando plan...</div>
    </div>

  </div>

</div>

<!-- FOOD PICKER MODAL -->
<div id="food-picker-modal" class="nutri-modal-overlay nutri-modal-hidden">
  <div class="nutri-picker-box">

    <div class="nutri-picker-header">
      <div class="nutri-picker-title">Agregar a <em id="picker-meal-lbl">comida</em></div>
      <button type="button" class="nutri-picker-close" onclick="nutriClosePicker()">✕</button>
    </div>

    <div class="nutri-picker-search-wrap">
      <span class="nutri-picker-search-icon">🔍</span>
      <input type="text" id="picker-search" class="nutri-picker-search"
             placeholder="Buscar alimento o receta..."
             oninput="nutriRenderPickerContent()">
    </div>

    <div class="nutri-picker-tabs">
      <button type="button" data-ptab="alimentos" onclick="nutriSwitchPickerTab('alimentos')" class="nutri-picker-tab activo">🥗 Alimentos</button>
      <button type="button" data-ptab="recetas"   onclick="nutriSwitchPickerTab('recetas')"   class="nutri-picker-tab">👨‍🍳 Recetas</button>
    </div>

    <div id="picker-cats-bar" class="nutri-picker-cats"></div>
    <div id="picker-list"     class="nutri-picker-list"></div>
  </div>
</div>

<!-- MODAL SUPLEMENTO -->
<div id="nutri-suple-modal" class="nutri-modal-overlay nutri-modal-hidden">
  <div class="nutri-modal-box">
    <div class="nutri-modal-titulo">Agregar suplemento</div>
    <div class="nutri-field">
      <label>Suplemento *</label>
      <input type="text" id="suple-nombre" class="nutri-input" placeholder="Ej. Omega 3, Vitamina D...">
    </div>
    <div class="nutri-grid-2">
      <div class="nutri-field">
        <label>Dosis</label>
        <input type="text" id="suple-dosis" class="nutri-input" placeholder="Ej. 1g, 2000UI">
      </div>
      <div class="nutri-field">
        <label>Momento</label>
        <select id="suple-frecuencia" class="nutri-input" title="Momento del día">
          <option>AM</option><option>PM</option><option>con comida</option>
          <option>con cena</option><option>diario</option><option>en ayunas</option>
        </select>
      </div>
    </div>
    <div class="nutri-field">
      <label>Razón (opcional)</label>
      <input type="text" id="suple-razon" class="nutri-input" placeholder="Ej. Deficiencia de vitamina D">
    </div>
    <div class="nutri-modal-btns">
      <button type="button" class="nutri-btn-guardar"   onclick="nutriGuardarSuple()">Guardar</button>
      <button type="button" class="nutri-btn-cancelar"  onclick="nutriCerrarModal('suple')">Cancelar</button>
    </div>
  </div>
</div>

<!-- MODAL EDITAR BMR -->
<div id="modalNutriBMR" class="nutri-modal-overlay nutri-modal-hidden">
  <div class="nutri-modal-box">
    <div class="nutri-modal-titulo">Calorías base (BMR)</div>
    <p class="nutri-modal-desc">Calorías que quemas solo por existir. Actualízalo cada semana al pesarte.</p>
    <div class="nutri-field">
      <label>kcal/día</label>
      <input type="number" id="nb-valor" class="nutri-input" placeholder="ej. 2500" min="1000" max="5000">
    </div>
    <div class="nutri-modal-btns">
      <button class="nutri-btn-guardar" onclick="nutriGuardarBMR()">Guardar</button>
      <button class="nutri-btn-cancelar" onclick="nutriCerrarModal('bmr')">Cancelar</button>
    </div>
  </div>
</div>

<!-- MODAL MI BAND -->
<div id="modalNutriMiBand" class="nutri-modal-overlay nutri-modal-hidden">
  <div class="nutri-modal-box">
    <div class="nutri-modal-titulo">Actividad Mi Band</div>
    <p class="nutri-modal-desc">Ingresa las calorías extra que quemaste hoy según tu Mi Band 10.</p>
    <div class="nutri-field">
      <label>kcal quemadas (actividad)</label>
      <input type="number" id="nm-valor" class="nutri-input" placeholder="ej. 350" min="0">
    </div>
    <div class="nutri-modal-btns">
      <button class="nutri-btn-guardar" onclick="nutriGuardarMiBand()">Guardar</button>
      <button class="nutri-btn-cancelar" onclick="nutriCerrarModal('miband')">Cancelar</button>
    </div>
  </div>
</div>
